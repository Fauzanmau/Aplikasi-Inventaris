name: lab
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  # Scanner
  mobile_scanner: ^7.1.4
  permission_handler: ^12.0.1

  # File & Export
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  path_provider: ^2.1.5
  file_picker: ^10.3.8

  # Media
  audioplayers: ^6.5.1
  image_picker: ^1.2.1

  # Utility
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  share_plus: ^12.0.2
  auto_size_text: ^3.0.0
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.5.5
  
  # 🔐 Crypto untuk Hashing Password (SHA256)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/beep.mp3
    - assets/images/logo.png
    - assets/images/tik.png
    - assets/images/Pengembang.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#A020F0"
  adaptive_icon_foreground: "assets/images/icon.png"
  remove_alpha_ios: true